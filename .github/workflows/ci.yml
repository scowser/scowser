name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt6 (macOS)
        if: runner.os == 'macOS'
        run: brew install qt@6

      - name: Install Qt6 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-webengine-dev qt6-base-dev libqt6svg6-dev libseccomp-dev

      - name: Configure
        run: |
          CMAKE_ARGS="-DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug"
          if [ "$RUNNER_OS" = "macOS" ]; then
            CMAKE_ARGS="$CMAKE_ARGS -DCMAKE_PREFIX_PATH=/opt/homebrew/opt/qt@6"
          fi
          cmake -B build $CMAKE_ARGS

      - name: Build
        run: cmake --build build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Test
        run: ctest --test-dir build --output-on-failure
