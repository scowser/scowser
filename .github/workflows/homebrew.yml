name: Update Homebrew Tap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to update tap with (e.g. v0.0.21)"
        required: true
        type: string
        default: v0.0.21

jobs:
  update-tap:
    runs-on: ubuntu-latest

    steps:
      - name: Validate tag format
        run: |
          if [[ ! "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Tag must match format vX.Y.Z (e.g. v0.0.21)"
            exit 1
          fi

      - name: Download release assets and compute SHA256
        id: sha
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          VERSION="${TAG#v}"
          REPO="${{ github.repository }}"

          # Source tarball (for Linux formula)
          TARBALL_URL="https://github.com/${REPO}/archive/refs/tags/${TAG}.tar.gz"
          echo "Downloading ${TARBALL_URL}..."
          curl -fSL -o release.tar.gz "${TARBALL_URL}"
          TARBALL_SHA256=$(sha256sum release.tar.gz | awk '{print $1}')
          echo "tarball_sha256=${TARBALL_SHA256}" >> "$GITHUB_OUTPUT"
          echo "tarball_url=${TARBALL_URL}" >> "$GITHUB_OUTPUT"
          echo "Tarball SHA256: ${TARBALL_SHA256}"

          # DMG (for macOS cask) — find the latest macOS version DMG
          DMG_NAME=$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq \
            '[.assets[].name | select(test("scowser-.*-macos-.*\\.dmg"))] | sort | last')

          if [ -z "${DMG_NAME}" ]; then
            echo "Error: No macOS DMG found in release ${TAG}"
            exit 1
          fi

          DMG_URL="https://github.com/${REPO}/releases/download/${TAG}/${DMG_NAME}"
          echo "Downloading ${DMG_URL}..."
          curl -fSL -o scowser.dmg "${DMG_URL}"
          DMG_SHA256=$(sha256sum scowser.dmg | awk '{print $1}')
          echo "dmg_sha256=${DMG_SHA256}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "DMG: ${DMG_NAME} SHA256: ${DMG_SHA256}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout homebrew-scowser tap
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/homebrew-scowser
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update cask (macOS)
        run: |
          CASK="homebrew-tap/Casks/scowser.rb"
          mkdir -p homebrew-tap/Casks

          cat > "${CASK}" << 'RUBY'
          cask "scowser" do
            version "VERSION_PLACEHOLDER"
            sha256 "DMG_SHA_PLACEHOLDER"

            url "https://github.com/scowser/scowser/releases/download/v#{version}/DMG_NAME_PLACEHOLDER"
            name "scowser"
            desc "Security-focused web browser with built-in ad blocking, DoH, and ephemeral sessions"
            homepage "https://github.com/scowser/scowser"

            app "scowser.app"
          end
          RUBY

          sed -i 's/^          //' "${CASK}"
          sed -i "s|VERSION_PLACEHOLDER|${{ steps.sha.outputs.version }}|g" "${CASK}"
          sed -i "s|DMG_SHA_PLACEHOLDER|${{ steps.sha.outputs.dmg_sha256 }}|g" "${CASK}"
          sed -i "s|DMG_NAME_PLACEHOLDER|${{ steps.sha.outputs.dmg_name }}|g" "${CASK}"

          echo "==> Updated cask:"
          cat "${CASK}"

      - name: Update formula (Linux)
        run: |
          FORMULA="homebrew-tap/Formula/scowser.rb"
          mkdir -p homebrew-tap/Formula
          REPO="${{ github.repository }}"

          cat > "${FORMULA}" << 'RUBY'
          class Scowser < Formula
            desc "Security-focused web browser with built-in ad blocking, DoH, and ephemeral sessions"
            homepage "https://github.com/REPO_PLACEHOLDER"
            url "URL_PLACEHOLDER"
            sha256 "SHA_PLACEHOLDER"
            license "Apache-2.0"

            depends_on :linux
            depends_on "cmake" => :build
            depends_on "qt@6"
            depends_on "libseccomp"
            depends_on "pkg-config" => :build

            def install
              args = %W[
                -DCMAKE_BUILD_TYPE=Release
                -DCMAKE_PREFIX_PATH=#{Formula["qt@6"].opt_prefix}
              ]

              system "cmake", "-S", ".", "-B", "build", *args, *std_cmake_args
              system "cmake", "--build", "build", "--parallel", ENV.make_jobs.to_s
              system "cmake", "--install", "build", "--prefix", prefix
            end

            def caveats
              <<~EOS
                scowser is a security-focused browser. By default:
                  - All sessions are ephemeral (no data persists after exit)
                  - DNS queries use DNS-over-HTTPS (Cloudflare)
                  - Ads and trackers are blocked at the request level
                  - All HTTP traffic is upgraded to HTTPS
              EOS
            end

            test do
              assert_match "scowser", shell_output("#{bin}/scowser --version 2>&1", 0)
            end
          end
          RUBY

          sed -i 's/^          //' "${FORMULA}"
          sed -i "s|REPO_PLACEHOLDER|${REPO}|g" "${FORMULA}"
          sed -i "s|URL_PLACEHOLDER|${{ steps.sha.outputs.tarball_url }}|g" "${FORMULA}"
          sed -i "s|SHA_PLACEHOLDER|${{ steps.sha.outputs.tarball_sha256 }}|g" "${FORMULA}"

          echo "==> Updated formula:"
          cat "${FORMULA}"

      - name: Commit and push to homebrew-scowser
        working-directory: homebrew-tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/scowser.rb Formula/scowser.rb
          git commit -m "scowser ${{ inputs.tag }}"
          git push
