name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-14, macos-15, macos-26]

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6
        run: brew install qt@6

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Debug: show what identities were imported
          echo "=== Available codesigning identities ==="
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          echo "=== All identities ==="
          security find-identity -v "$KEYCHAIN_PATH"

      - name: Build
        run: |
          QT_PREFIX=$(brew --prefix qt@6)
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_PREFIX"
          cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Package and sign .app bundle
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/scowser.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          QT_PREFIX=$(brew --prefix qt@6)
          MACDEPLOYQT=$(find "$QT_PREFIX" /opt/homebrew /usr/local -name macdeployqt -type f 2>/dev/null | head -1)
          if [ -n "$MACDEPLOYQT" ]; then
            "$MACDEPLOYQT" "$APP" -verbose=1 || true
          fi

          # Remove plugins we don't need (avoids unresolvable QtVirtualKeyboard deps)
          rm -rf "$APP/Contents/PlugIns/virtualkeyboard"

          # Copy missing transitive dylibs that macdeployqt fails to resolve
          copy_lib() {
            local lib_name="$1"
            local src
            src=$(find /opt/homebrew/lib /opt/homebrew/opt/*/lib -name "$lib_name" -type f 2>/dev/null | head -1)
            if [ -n "$src" ] && [ ! -f "$FRAMEWORKS/$lib_name" ]; then
              echo "Copying missing lib: $src -> $FRAMEWORKS/$lib_name"
              cp "$src" "$FRAMEWORKS/$lib_name"
              chmod 644 "$FRAMEWORKS/$lib_name"
              # Rewrite the install name to @rpath
              install_name_tool -id "@rpath/$lib_name" "$FRAMEWORKS/$lib_name" 2>/dev/null || true
            fi
          }

          mkdir -p "$FRAMEWORKS"
          copy_lib "libbrotlicommon.1.dylib"
          copy_lib "libwebp.7.dylib"
          copy_lib "libsharpyuv.0.dylib"

          # Fix any remaining @rpath references inside bundled dylibs
          for dylib in "$FRAMEWORKS"/*.dylib; do
            otool -L "$dylib" 2>/dev/null | grep "@rpath" | awk '{print $1}' | while read -r dep; do
              dep_name=$(basename "$dep")
              if [ -f "$FRAMEWORKS/$dep_name" ]; then
                install_name_tool -change "$dep" "@loader_path/$dep_name" "$dylib" 2>/dev/null || true
              fi
            done
          done

          # Also fix @rpath refs inside frameworks
          find "$FRAMEWORKS" -name "*.framework" -type d | while read -r fw; do
            fw_name=$(basename "$fw" .framework)
            fw_bin="$fw/Versions/A/$fw_name"
            [ -f "$fw_bin" ] || continue
            otool -L "$fw_bin" 2>/dev/null | grep "@rpath" | awk '{print $1}' | while read -r dep; do
              dep_name=$(basename "$dep")
              if [ -f "$FRAMEWORKS/$dep_name" ]; then
                install_name_tool -change "$dep" "@loader_path/../../$dep_name" "$fw_bin" 2>/dev/null || true
              fi
            done
          done

          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | head -1 | sed 's/.*"\(.*\)"/\1/')

          # Sign all Mach-O binaries inside frameworks, then standalone dylibs
          find "$FRAMEWORKS" -type f -perm +111 | while read -r binary; do
            file "$binary" | grep -q "Mach-O" && \
              codesign --force --options runtime --sign "$IDENTITY" --timestamp "$binary"
          done

          find "$APP" -name "*.dylib" -type f -exec \
            codesign --force --options runtime --sign "$IDENTITY" --timestamp {} \;

          # Sign the main app bundle
          codesign --force --options runtime --sign "$IDENTITY" --timestamp \
            --deep "$APP"

          # Verify signature (spctl will reject until notarized, so only check codesign here)
          codesign --verify --deep --strict "$APP"

      - name: Create DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          hdiutil create -volname "scowser-${VERSION}" \
            -srcfolder "build/scowser.app" \
            -ov -format UDZO \
            -fs HFS+ \
            "scowser-${VERSION}-${{ matrix.runner }}.dmg"

      - name: Sign DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="scowser-${VERSION}-${{ matrix.runner }}.dmg"
          IDENTITY=$(security find-identity -v -p codesigning "$RUNNER_TEMP/signing.keychain-db" | head -1 | sed 's/.*"\(.*\)"/\1/')
          codesign --force --sign "$IDENTITY" \
            --timestamp "$DMG"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DMG="scowser-${VERSION}-${{ matrix.runner }}.dmg"

          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          xcrun stapler staple "$DMG"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/certificate.p12"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.runner }}
          path: "*.dmg"

  build-linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: x86_64

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-webengine-dev qt6-base-dev libseccomp-dev \
            libfuse2 file

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build --parallel $(nproc)

      - name: Run tests
        run: |
          cmake -B build-test -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build build-test --parallel $(nproc)
          ctest --test-dir build-test --output-on-failure

      - name: Create AppImage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Install linuxdeploy
          curl -fSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt

          # Create AppDir
          DESTDIR=AppDir cmake --install build
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp packaging/linux/scowser.desktop AppDir/usr/share/applications/

          # Create a simple icon placeholder if none exists
          if [ ! -f "resources/icons/scowser.png" ]; then
            convert -size 256x256 xc:'#2d5016' -fill white \
              -font Helvetica -pointsize 64 -gravity center \
              -annotate 0 'S' AppDir/usr/share/icons/hicolor/256x256/apps/scowser.png 2>/dev/null || \
            printf '\x89PNG\r\n\x1a\n' > AppDir/usr/share/icons/hicolor/256x256/apps/scowser.png
          else
            cp resources/icons/scowser.png AppDir/usr/share/icons/hicolor/256x256/apps/
          fi

          cp AppDir/usr/share/icons/hicolor/256x256/apps/scowser.png AppDir/

          # Build AppImage
          export QMAKE=$(which qmake6 2>/dev/null || which qmake)
          OUTPUT="scowser-${VERSION}-linux-${{ matrix.arch }}.AppImage"
          ./linuxdeploy --appdir AppDir \
            --plugin qt \
            --desktop-file AppDir/usr/share/applications/scowser.desktop \
            --output appimage || true

          # Rename if linuxdeploy created a default name
          GENERATED=$(ls scowser*.AppImage 2>/dev/null | head -1)
          if [ -n "$GENERATED" ] && [ "$GENERATED" != "$OUTPUT" ]; then
            mv "$GENERATED" "$OUTPUT"
          fi

          # Fallback: create tarball if AppImage creation failed
          if [ ! -f "$OUTPUT" ]; then
            echo "AppImage creation failed, creating tarball instead"
            OUTPUT="scowser-${VERSION}-linux-${{ matrix.arch }}.tar.gz"
            tar -czf "$OUTPUT" -C AppDir .
          fi

      - name: Create tarball
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DESTDIR=tar-root cmake --install build
          tar -czf "scowser-${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C tar-root .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            *.AppImage
            *.tar.gz

  release:
    name: Create Release
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for release notes

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          # Get previous tag
          PREV_TAG=$(git tag --sort=-v:refname | grep '^v' | sed -n '2p')

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${GITHUB_REF_NAME}"
            COMPARE_URL="${{ github.server_url }}/${{ github.repository }}/compare/${PREV_TAG}...${GITHUB_REF_NAME}"
          else
            RANGE="${GITHUB_REF_NAME}"
            COMPARE_URL=""
          fi

          # Build categorized changelog
          {
            echo "## What's Changed"
            echo ""

            # Features
            FEATURES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="feat" --grep="add" --grep="new" -i)
            if [ -n "$FEATURES" ]; then
              echo "### New Features"
              echo "$FEATURES"
              echo ""
            fi

            # Fixes
            FIXES=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="fix" --grep="bug" -i)
            if [ -n "$FIXES" ]; then
              echo "### Bug Fixes"
              echo "$FIXES"
              echo ""
            fi

            # Security
            SECURITY=$(git log "$RANGE" --pretty=format:"- %s (%h)" --grep="security" --grep="cve" --grep="vuln" -i)
            if [ -n "$SECURITY" ]; then
              echo "### Security"
              echo "$SECURITY"
              echo ""
            fi

            # Everything else
            OTHER=$(git log "$RANGE" --pretty=format:"- %s (%h)" \
              --grep="feat" --grep="add" --grep="new" --grep="fix" --grep="bug" --grep="security" --grep="cve" --grep="vuln" \
              -i --invert-grep)
            if [ -n "$OTHER" ]; then
              echo "### Other Changes"
              echo "$OTHER"
              echo ""
            fi

            echo "## Downloads"
            echo ""
            echo "| Platform | File |"
            echo "|----------|------|"
            for f in artifacts/*; do
              fname=$(basename "$f")
              echo "| ${fname} | [Download](${fname}) |"
            done
            echo ""

            echo "## Install"
            echo ""
            echo "**Homebrew (macOS & Linux):**"
            echo '```bash'
            echo "brew tap ${{ github.repository_owner }}/scowser"
            echo "brew install scowser"
            echo '```'
            echo ""
            echo "**macOS:** Download the \`.dmg\` for your architecture and drag scowser to Applications."
            echo ""
            echo "**Linux:** Download the \`.AppImage\`, \`chmod +x\`, and run. Or extract the \`.tar.gz\`."
            echo ""

            if [ -n "$COMPARE_URL" ]; then
              echo "**Full Changelog:** $COMPARE_URL"
            fi
          } > release_notes.md

          cat release_notes.md

      - name: Compute checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          mv SHA256SUMS.txt ../
          cd ..

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "scowser v${VERSION}" \
            --notes-file release_notes.md \
            artifacts/* \
            SHA256SUMS.txt
